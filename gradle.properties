org.gradle.parallel=true
org.gradle.caching=true

# Android settings
android.useAndroidX=true
# OwnTV Core exposes translated resource identifiers to its host. Its public
# integration surface requires transitive R classes while the IPTV migration is
# enabled.
android.nonTransitiveRClass=false
# KSP/Hilt still require the external Kotlin Android plugin under AGP 9.
android.builtInKotlin=false
# Temporary compatibility mode while ARVIO's Hilt/KSP build migrates to AGP 9.
android.newDsl=false

# Kotlin
kotlin.code.style=official

# Compose
android.enableJetifier=false



hilt.enableAggregatingTask=false

# Isolated owner-brand test branch only. Uses the existing signed testing workflow.
brandDirectory=../owner-test-brand-revision2
