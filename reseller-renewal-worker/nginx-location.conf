# Include INSIDE the EXISTING service-bearing server for resellerworker.extremeiptv.net
# (HTTPS, or its existing HTTP origin behind the established TLS proxy).
# Only the renewal prefix moves to the new service. Auth/trial/portal routes stay.
location ^~ /branded-renewals/ {
    proxy_pass http://127.0.0.1:9093;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 16k;
}
