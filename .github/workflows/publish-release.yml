name: Publish Customer Release

# Builds the sideloadStaging APK (release-grade: R8 + resource shrinking +
# baseline profile) and publishes it as a GitHub Release. This is the build
# type you've been shipping to customers, so this workflow just formalizes
# that into an actual GitHub Release instead of a CI artifact.
#
# This is the release the in-app updater checks against (AppUpdateRepository
# hits /repos/{owner}/{repo}/releases/latest), so this workflow is what makes
# "check for updates" in the app actually work.
#
# Signed with the stable release keystore stored in repo secrets
# (RELEASE_KEYSTORE_BASE64/RELEASE_KEYSTORE_PASSWORD/RELEASE_KEY_ALIAS/
# RELEASE_KEY_PASSWORD). staging automatically picks up signingConfigs.release
# when its storeFile is set (see app/build.gradle.kts) — this is what makes
# every release sign identically, so updates install in place instead of
# hitting a signature conflict. Without this, GitHub Actions would generate a
# fresh random debug key on every run and no update would ever install cleanly.
#
# The GitHub Release itself is labeled as a normal release (tag "vX.Y.Z",
# not "beta"/"staging") since that's the only thing customers see — the
# in-app version label was already cleaned up separately.
#
# Run manually from Actions -> Publish Customer Release -> Run workflow,
# picking whichever branch is ready to ship. It does NOT run automatically
# on every push, since staging/testing is a work-in-progress branch and you
# don't want customers auto-notified of unfinished builds.
#
# The release tag and version are read directly from app/build.gradle.kts
# (versionName), so bump that first, then run this.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's new in this release (shown in the app's update dialog). Leave blank to auto-generate from commits."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read version from build.gradle.kts
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION_NAME as tag v$VERSION_NAME"

      - name: Prepare build configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL: ${{ secrets.ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          cp secrets.defaults.properties secrets.properties

          set_secret() {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            sed -i "/^${key}=/d" secrets.properties
            printf '%s\n' "${key}=${value}" >> secrets.properties
          }

          set_secret TMDB_API_KEY "${TMDB_API_KEY}"
          set_secret ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL "${ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL}"
          set_secret SENTRY_DSN "${SENTRY_DSN}"

          if [ -z "${TMDB_API_KEY}" ]; then
            echo "::warning::TMDB_API_KEY is not set — Trending/catalog rows will be empty."
          fi

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Every build without it gets signed with a fresh random debug key, so updates cannot install over existing installs. Add the 4 keystore secrets before running this again."
            exit 1
          fi
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build staging APK
        # `staging` = initWith(release): R8 full mode, resource shrinking,
        # baseline profile, isDebuggable=false. Picks up signingConfigs.release
        # automatically now that keystore.properties exists (see above step).
        run: >-
          ./gradlew :app:assembleSideloadStaging
          -x :app:validateReleaseCloudSecrets
          --no-daemon
          --stacktrace

      - name: Rename APK for release asset
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/sideload/staging -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK found in app/build/outputs/apk/sideload/staging"
            exit 1
          fi
          DEST="ExtremeTV-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: extremetv-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Upload R8 mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extremetv-release-mapping
          path: app/build/outputs/mapping/sideloadStaging/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Extreme TV ${{ steps.version.outputs.name }}
          body: ${{ github.event.inputs.release_notes || format('Automated release build from {0}.', github.ref_name) }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
