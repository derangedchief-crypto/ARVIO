name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build sideload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleSideloadDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arvio-test-debug-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          retention-days: 14
