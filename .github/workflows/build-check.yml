name: Build Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      # Production delivery is validated by the signed Publish workflow. Keep
      # ordinary branch checks secret-free and focused on compiling the APK;
      # the legacy unit suite has unrelated, currently unstable expectations.
      - name: Compile debug APK
        run: ./gradlew assembleSideloadDebug --no-daemon

# Signed-release validation lives in publish-testing-apk.yml, where the release
# environment supplies the keystore and runtime credentials. Build Check stays
# secret-free so pull-request verification can always run.
