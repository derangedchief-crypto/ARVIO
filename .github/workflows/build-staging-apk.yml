name: Build Optimized Test APK

# Release-grade build (R8 + resource shrinking + baseline profile +
# non-debuggable) for on-device performance testing against the Play Store
# build. Installs alongside it because the `staging` build type applies
# applicationIdSuffix ".beta".
#
# Cloud-secret validation is deliberately skipped: Supabase realtime sync and
# Trakt are not in use here. R8, the baseline profile and the non-debuggable
# flag are all unaffected, so performance results remain valid.
on:
  workflow_dispatch:

jobs:
  build-staging-apk:
    name: Build sideload staging APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare build configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL: ${{ secrets.ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          cp secrets.defaults.properties secrets.properties

          # Delete-then-append rather than `sed s|old|new|`: these values can
          # legitimately contain '|', '&' or '/', which would corrupt a
          # substitution. Deleting the placeholder line and appending is safe
          # for any value, and later keys win in a .properties file anyway.
          set_secret() {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            sed -i "/^${key}=/d" secrets.properties
            printf '%s\n' "${key}=${value}" >> secrets.properties
          }

          set_secret TMDB_API_KEY "${TMDB_API_KEY}"
          set_secret ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL "${ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL}"
          set_secret SENTRY_DSN "${SENTRY_DSN}"

          if [ -z "${TMDB_API_KEY}" ]; then
            echo "::warning::TMDB_API_KEY is not set — Trending/catalog rows will be empty."
          fi
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::warning::SENTRY_DSN is not set — crashes will NOT be reported even though ENABLE_CRASH_REPORTING is true for the staging build type."
          fi

          echo "Supabase/Trakt secrets intentionally omitted; cloud sync will be non-functional in this APK."

      - name: Build staging APK
        # `staging` = initWith(release): R8 full mode, resource shrinking,
        # baseline profile (committed at app/src/main/baseline-prof.txt, so no
        # device is needed to generate it), isDebuggable=false.
        # Signing falls back to the debug config when keystore.properties is
        # absent, so the artifact is installable via adb.
        #
        # validateReleaseCloudSecrets is excluded: it is attached to
        # preSideloadStagingBuild purely as a guard and produces no build output.
        run: >-
          ./gradlew :app:assembleSideloadStaging
          -x :app:validateReleaseCloudSecrets
          --no-daemon
          --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arvio-staging-apk
          path: app/build/outputs/apk/sideload/staging/*.apk
          retention-days: 14

      - name: Upload R8 mapping file
        # Required to deobfuscate any stack trace from this build — R8 renames
        # everything, so a raw logcat trace will be unreadable without it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvio-staging-mapping
          path: app/build/outputs/mapping/sideloadStaging/mapping.txt
          retention-days: 90
          if-no-files-found: warn
