name: Build Optimized Test APK

# Release-grade build (R8 + baseline profile + non-debuggable) for on-device
# performance testing. Installs alongside the Play Store app because the
# `staging` build type applies applicationIdSuffix ".beta".
on:
  workflow_dispatch:

jobs:
  build-staging-apk:
    name: Build sideload staging APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare build configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL: ${{ secrets.ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          cp secrets.defaults.properties secrets.properties

          # Delete-then-append rather than `sed s|old|new|`: several of these
          # values legitimately contain '|', '&' or '/', which would corrupt a
          # substitution. Deleting the placeholder line and appending is safe
          # for any value, and later keys win in a .properties file anyway.
          set_secret() {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            sed -i "/^${key}=/d" secrets.properties
            printf '%s\n' "${key}=${value}" >> secrets.properties
          }

          set_secret TMDB_API_KEY "${TMDB_API_KEY}"
          set_secret ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL "${ENTITLEMENT_CLOUD_STREAM_MANIFEST_URL}"
          set_secret SUPABASE_URL "${SUPABASE_URL}"
          set_secret APP_ANON_KEY "${APP_ANON_KEY}"
          set_secret TRAKT_CLIENT_ID "${TRAKT_CLIENT_ID}"
          set_secret TRAKT_CLIENT_SECRET "${TRAKT_CLIENT_SECRET}"
          set_secret SENTRY_DSN "${SENTRY_DSN}"

          # app/build.gradle.kts wires validateReleaseCloudSecrets into
          # preSideloadStagingBuild and requires all four of these. Check here so
          # the failure names the missing secret instead of surfacing as an
          # opaque Gradle `require` failure several minutes in.
          missing=""
          for pair in \
            "SUPABASE_URL=${SUPABASE_URL}" \
            "APP_ANON_KEY=${APP_ANON_KEY}" \
            "TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}" \
            "TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}"
          do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Release-grade builds require these repo secrets:${missing}"
            exit 1
          fi

          if [ -z "${TMDB_API_KEY}" ]; then
            echo "::warning::TMDB_API_KEY is not set — Trending/catalog rows will be empty."
          fi
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::warning::SENTRY_DSN is not set — crashes will not be reported."
          fi

      - name: Build staging APK
        # `staging` = initWith(release): R8 full mode, resource shrinking,
        # baseline profile, isDebuggable=false, ENABLE_CRASH_REPORTING=true.
        run: ./gradlew :app:assembleSideloadStaging --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arvio-staging-apk
          path: app/build/outputs/apk/sideload/staging/*.apk
          retention-days: 14

      - name: Upload R8 mapping file
        # Needed to deobfuscate any Sentry stack traces from this build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvio-staging-mapping
          path: app/build/outputs/mapping/sideloadStaging/mapping.txt
          retention-days: 90
          if-no-files-found: warn
