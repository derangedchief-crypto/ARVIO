name: One-Time Generate Release Keystore

# Run this ONCE to create a stable signing keystore, then delete this
# workflow file. It doesn't need Java/Android Studio locally — it runs
# entirely on the GitHub-hosted runner, same as your other builds.
#
# After running:
#   1. Open this run in the Actions tab, scroll to "Artifacts", download
#      "release-keystore" (a zip).
#   2. Unzip it. Inside: release.keystore, release.keystore.base64.txt,
#      and keystore-info.txt (alias + both passwords).
#   3. Go to Settings -> Secrets and variables -> Actions -> New repository
#      secret, and create 4 secrets using the values from those files:
#        RELEASE_KEYSTORE_BASE64   <- entire contents of release.keystore.base64.txt
#        RELEASE_KEYSTORE_PASSWORD <- from keystore-info.txt
#        RELEASE_KEY_ALIAS         <- from keystore-info.txt
#        RELEASE_KEY_PASSWORD      <- from keystore-info.txt
#   4. Delete this workflow file (generate-keystore.yml) from the repo —
#      it's only needed once, and there's no reason to leave a
#      keystore-generating workflow lying around.
#   5. Keep the downloaded zip somewhere safe (password manager, private
#      backup). If you ever lose it, you lose the ability to sign updates
#      that install over existing installs — there's no "reset" for this.
on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore and passwords
        run: |
          set -euo pipefail

          # PKCS12 (the default keystore format since JDK 9, and what this
          # setup-java JDK 17 uses) does NOT support a separate password per
          # key entry — despite keytool accepting -keypass, it silently
          # encrypts using the store password and ignores a differing
          # -keypass value. So store and key password MUST be identical here,
          # or later reads with the (wrong) key password fail with a
          # padding/decryption error. One password, used for both.
          KEYSTORE_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          ALIAS="extremetv_release"

          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Extreme TV Network, OU=App, O=Extreme TV, L=Toronto, ST=ON, C=CA"

          base64 -w0 release.keystore > release.keystore.base64.txt

          cat > keystore-info.txt <<EOF
          Keep this file private. These values become GitHub repo secrets.

          RELEASE_KEYSTORE_PASSWORD = $KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS         = $ALIAS
          RELEASE_KEY_PASSWORD      = $KEYSTORE_PASSWORD
          (store and key password are intentionally the same value — see
          the workflow comment for why)

          RELEASE_KEYSTORE_BASE64 = the full contents of release.keystore.base64.txt
          (paste that file's contents as-is, it's already base64 with no line breaks)
          EOF

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.base64.txt
            keystore-info.txt
          retention-days: 1
